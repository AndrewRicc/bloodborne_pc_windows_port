# Builds the port on Windows, runs the tests, packs the installer and tests it.
#   - every push to master and every pull request: build + tests + installer (kept as an artifact);
#   - a tag "v<version>" (git tag v0.3.0 && git push origin v0.3.0): the same, then the installer is
#     published as a GitHub release.
# The installer never contains game files or NVIDIA DLSS files: DLSS is built on the user's PC,
# and the installer test proves that this build works.
name: Windows installer

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: powershell
    steps:
      - name: Allow long paths in git
        run: git config --global core.longpaths true

      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update MSYS2
        # The runner image ships MSYS2 in C:\msys64. Two passes: the first one may only update
        # the core packages.
        # The first pass may end with an error code when it replaces
        # the running core: the build step fails by itself if MSYS2 is really broken.
        run: |
          $ErrorActionPreference = 'Continue'
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syuu --noconfirm"
          C:\msys64\usr\bin\bash.exe -lc "pacman -Syuu --noconfirm"
          exit 0

      - name: Build the port (setup.bat)
        # The runner has no NVIDIA RTX card, so the DLSS part is skipped anyway; -NoDlss makes it
        # explicit. -NoShortcut: no desktop on a runner.
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\setup.ps1 -NoDlss -NoShortcut
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Tests
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\run_tests.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install Inno Setup
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup --no-progress -y }

      - name: Build the installer
        run: |
          $arguments = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $arguments = '-Version', ($env:GITHUB_REF_NAME -replace '^v', '') }
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\make_installer.ps1 @arguments
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Test the installer
        # -BuildDlss: builds DLSS in the installed copy as a user would (NVIDIA's SDK files are
        # downloaded into the test folder and deleted with it; the runner has Visual Studio).
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\test_installer.ps1 -BuildDlss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: bbport-setup
          path: dist/bbport-setup-*.exe
          if-no-files-found: error

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          # Explicit: in a fork gh could otherwise pick the parent repository.
          GH_REPO: ${{ github.repository }}
        run: |
          # gh writes to stderr when the release does not exist yet: not an error.
          $ErrorActionPreference = 'Continue'
          $tag = $env:GITHUB_REF_NAME
          $setup = (Get-ChildItem dist\bbport-setup-*.exe | Select-Object -First 1).FullName
          Write-Host "Repository: $env:GH_REPO   tag: $tag   file: $setup"
          Set-Content -Path release_notes.md -Encoding UTF8 -Value @(
            'Windows installer of the Bloodborne PC port with the multilingual menu.',
            '',
            'It contains the port only: no game files. You need your own copy of Bloodborne (CUSA03173, version 1.09) dumped from your PS4, and Python 3.10 or newer.',
            '',
            'FSR 3.1, FSR 4 and TAA are included. DLSS is not shipped: on a PC with an NVIDIA RTX card the installer offers to build it there (it downloads the SDK files from NVIDIA and needs the Microsoft C++ compiler), and build_dlss.bat in the installation folder does the same later.'
          )
          gh release view $tag --json tagName,isDraft
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'The release exists: replacing its installer'
            gh release upload $tag $setup --clobber
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::uploading the installer failed'; exit 1 }
            gh release edit $tag --draft=false
          } else {
            Write-Host 'Creating the release'
            gh release create $tag $setup --title "Bloodborne PC Port $tag" --notes-file release_notes.md --verify-tag
            if ($LASTEXITCODE -ne 0) { Write-Host '::error::creating the release failed'; exit 1 }
          }
          # The step is only green when the published release really holds the installer.
          $assets = gh release view $tag --json isDraft,assets --jq '[.isDraft, (.assets | length)] | @tsv'
          Write-Host "Published release (draft, files): $assets"
          if ($LASTEXITCODE -ne 0 -or $assets -notmatch '^false\s+[1-9]') { Write-Host '::error::the release is missing, still a draft, or has no installer'; exit 1 }
